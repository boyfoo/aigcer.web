<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>日间主题视觉对照</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #d8d3c7; color: #26362e; font-family: system-ui, sans-serif; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; }
      h1 { margin: 0 0 8px; font-size: 17px; font-weight: 600; }
      .frame { position: relative; width: 100%; aspect-ratio: 1488 / 1058; overflow: hidden; border: 1px solid #aaa393; background: #f6f2e8; }
      img { display: block; width: 100%; height: 100%; object-fit: contain; }
      iframe { position: absolute; inset: 0 auto auto 0; width: 1488px; height: 1058px; border: 0; transform-origin: 0 0; }
    </style>
  </head>
  <body>
    <main class="grid">
      <section><h1>参考图 · 日间</h1><div class="frame"><img src="./reference-light-approved-v2.png" alt="日间参考图" /></div></section>
      <section><h1>当前实现 · 日间</h1><div class="frame"><iframe src="/?theme=celadon" title="日间实现"></iframe></div></section>
    </main>
    <script>
      const fitPreview = () => document.querySelectorAll('.frame iframe').forEach((frame) => {
        frame.style.transform = `scale(${frame.parentElement.clientWidth / 1488})`;
      });
      addEventListener('resize', fitPreview);
      fitPreview();
    </script>
  </body>
</html>
